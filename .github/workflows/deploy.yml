name: deploy

# CI/CD for the Cloud Run Job runtime. Bot code changes need no deploy at all:
# the job clones main at the start of every run. This workflow only fires when
# the runtime image or this pipeline changes.
on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: xrplf-automation
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/xrplf-automation/images/copilot-review-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/21551682866/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: deployer@xrplf-automation.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" deploy/
          docker push --all-tags "$IMAGE"

      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update copilot-review-bot \
            --image "$IMAGE:${GITHUB_SHA}" \
            --region "$REGION" --project "$PROJECT_ID"
